<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="src/output.css" rel="stylesheet">
    <script src="index.js" defer></script>
</head>

    <body class="h-screen bg-gradient-to-r from-green-500 to-lime-400 flex justify-center ">
  <div class="w-full max-w-xl mx-auto p-6 pt-10">
    <!-- Heading -->
    <h1 class="text-center text-3xl font-bold text-white mb-6 drop-shadow-md">
      To Do List
    </h1>


    <!-- Input + Button -->
    <div id="container" class="flex gap-2">
      <input
        type="text" 
        placeholder="Enter task..." 
        class=" textarea flex-1 px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 bg-white"
      >
      <button id="addTask", 
        class="px-4 py-2 rounded-lg bg-white border border-gray-300 hover:bg-gray-100 transition"
      >
        ✔
      </button>

      
    </div>
    <div id="toDoList" class=" mt-6 space-y-4">
      <!-- To-Do items will be added here --> 

    
  </div>
  </div>
    
</body>
</html>
